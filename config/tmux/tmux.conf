# https://tmux.app/#config-generator
# ── Prefix Key ──────────────────────────
# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
# How long (ms) tmux waits between repeats before requiring the prefix again
set -g repeat-time 1000
# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right ""
# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# ── Keybindings ──────────────────────
# Split pane down (horizontal line)
bind e split-window -v -c "#{pane_current_path}"
# Split pane right (vertical line)
bind r split-window -h -c "#{pane_current_path}"

# Navigate panes with prefix + Arrow
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# Resize panes with prefix + Shift+Arrow, repeatable while held
bind -r C-Left  resize-pane -L 8
bind -r C-Right resize-pane -R 8
bind -r C-Up    resize-pane -U 8
bind -r C-Down  resize-pane -D 8
