# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator
# ── Prefix Key ──────────────────────────
# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
# How long (ms) tmux waits between repeats before requiring the prefix again
set -g repeat-time 1000
# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right ""
# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# ── Keybindings ──────────────────────
# Split pane down (horizontal line)
bind e split-window -v -c "#{pane_current_path}"
# Split pane right (vertical line)
bind r split-window -h -c "#{pane_current_path}"
# Resize panes with prefix + Arrow, repeatable while held
bind -r Left  resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
