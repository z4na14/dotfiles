font_family      Lilex
bold_font        auto
italic_font      auto
bold_italic_font auto
# background #1e1e2e
window_padding_width 8
cursor_trail 1

# Required for nvim control
allow_remote_control yes
listen_on unix:@mykitty

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
