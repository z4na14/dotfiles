# ## Prefix Key ############################
# Prefix is Ctrl+a. Pressing it twice sends a literal Ctrl+a (send-prefix)
map ctrl+a>ctrl+a send_text all \x01

# ## Splits (panes) ########################
# Split down (horizontal line) / split right (vertical line), keeping the cwd
enabled_layouts splits,stack
map ctrl+a>e launch --location=hsplit --cwd=current
map ctrl+a>r launch --location=vsplit --cwd=current

# Navigate panes with prefix + Arrow
map ctrl+a>left  neighboring_window left
map ctrl+a>right neighboring_window right
map ctrl+a>up    neighboring_window up
map ctrl+a>down  neighboring_window down

# Resize panes with prefix + Ctrl+Arrow
map ctrl+a>ctrl+left  resize_window narrower 8
map ctrl+a>ctrl+right resize_window wider 8
map ctrl+a>ctrl+up    resize_window taller 8
map ctrl+a>ctrl+down  resize_window shorter 8

# Repeatable resize (tmux's `bind -r`): prefix + Shift+R enters a mode where
# the arrows keep resizing; Esc, Enter or any other key leaves it
map --new-mode resize --on-unknown end ctrl+a>shift+r
map --mode resize left  resize_window narrower 8
map --mode resize right resize_window wider 8
map --mode resize up    resize_window taller 8
map --mode resize down  resize_window shorter 8
map --mode resize esc   pop_keyboard_mode
map --mode resize enter pop_keyboard_mode

# ## Tabs (tmux windows) ###################
map ctrl+a>c new_tab_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>comma set_tab_title
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# ## Extras you'll miss from tmux ##########
map ctrl+a>x close_window
map ctrl+a>shift+x close_tab
map ctrl+a>z toggle_layout stack
map ctrl+a>q focus_visible_window
map ctrl+a>bracketleft show_scrollback
